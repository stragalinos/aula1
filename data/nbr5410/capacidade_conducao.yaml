# =============================================================================
# CAPACIDADE DE CONDUÇÃO DE CORRENTE (A) — condutores de cobre
# -----------------------------------------------------------------------------
# Usado em: nucleo/condutores.py (etapa b5)
#
# Formato "tabela" (igual ao da norma impressa):
#   cada LINHA  = uma seção nominal em mm² (entre aspas, com ponto decimal)
#   cada COLUNA = método de referência + nº de condutores carregados
#                 ex.: "B1-2" = método B1 com 2 condutores carregados
#                      "B1-3" = método B1 com 3 condutores carregados
#   cada linha precisa ter exatamente um valor para cada coluna (12 valores).
#
# Você só precisa preencher as colunas dos métodos que vai usar (veja
# metodos_instalacao.yaml); o cálculo avisa se precisar de algum valor vazio.
# Se a norma não tiver valor para uma célula, escreva NAO_SE_APLICA.
# Pode acrescentar seções maiores copiando uma linha.
# =============================================================================

metadados:
  titulo: Capacidade de condução de corrente - condutores de cobre
  descricao: >-
    Corrente máxima (A) que o condutor conduz continuamente, por isolação,
    método de referência e número de condutores carregados, nas condições de
    referência da norma (antes dos fatores de correção).
  fonte: ABNT NBR 5410
  referencia: "A_VALIDAR - nº das tabelas de capacidade de condução (uma por isolação)"
  edicao_norma: A_VALIDAR
  status: A_VALIDAR
  validado_por: ""
  data_validacao: ""
  observacoes: ""

condutor: cobre
unidade: A

