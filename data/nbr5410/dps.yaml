    "127/220":
      ligacao: A_VALIDAR                        # descreva os modos de ligação (ex. fase-PE, neutro-PE)
      uc_minima_V: {fase_pe: A_VALIDAR, neutro_pe: A_VALIDAR}
    "220/380":
