# =============================================================================
# EQUIPAMENTOS TÍPICOS — SUGESTÕES PARA O FORMULÁRIO
# -----------------------------------------------------------------------------
# Usado em: formulário (etapa f). Quando o técnico escolhe um equipamento, estes
# valores aparecem já preenchidos, mas ele DEVE conferir e corrigir com os dados
# de placa do aparelho real.
# ATENÇÃO: todos os valores são EXEMPLOS de potências comuns no mercado. Ajuste
# conforme a sua experiência; não são valores normativos.
# Ar-condicionado: informe a potência ELÉTRICA (W). A capacidade em BTU/h não é
# convertida automaticamente porque depende da eficiência do aparelho.
# tem_motor: true -> o sistema usa a curva de disjuntor para motores (decisão D10).
# Tensão: em sistemas 220/380 V não existe 127 V; o formulário trocará por 220 V.
# =============================================================================

metadados:
  titulo: Equipamentos típicos (sugestões do formulário)
  descricao: >-
    Potência, fator de potência e tensão sugeridos para equipamentos comuns em
    residências. Servem apenas como ponto de partida no formulário.
  fonte: Valores de exemplo do sistema
  status: EXEMPLO
  validado_por: ""
  data_validacao: ""
  observacoes: ""

